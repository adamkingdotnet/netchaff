name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    uses: adamkingdotnet/.github/.github/workflows/python-check.yml@main
    with:
      installer: pip
      install-command: pip install -r requirements-dev.txt requests pytest
      lint-command: ruff check netchaff.py tests/
      typecheck-command: mypy netchaff.py
      test-command: python -m pytest tests/ -v
      smoke-command: python netchaff.py --config config.json --timeout 15 --log warning
